[project]
name = "palette"
version = "0.1.0"
description = "Observable, operable, resettable QEMU virtual desktops for visual agents"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.20",
    "pillow>=11.0",
    "pydantic>=2.9",
    "psutil>=6.0",
    "websockets>=15.0",
    "pycryptodome>=3.23",
    "wsgidav>=4.3,<5",
    "h11>=0.16,<1",
]

[project.scripts]
palette = "palette.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-psutil>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palette"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501",
    # ASYNC109 wants asyncio.timeout() where a coroutine takes a `timeout` argument.
    # Here a timeout is a budget handed to asyncio.wait_for around a QMP command, a
    # capture, a helper process or one guest-tool request: the value comes from trusted
    # configuration and is reported in the receipt, so a context manager would obscure
    # rather than clarify it.
    "ASYNC109",
    # ASYNC240 flags blocking pathlib calls inside async functions. The plan accepts
    # bounded synchronous local file I/O for capture (read the dump, delete it) and for
    # overlay creation; moving those to a thread would add complexity without changing
    # the latency profile measured in docs/benchmarks.md.
    "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Operator scripts are run by a human at a terminal and check their own invariants with
# asserts; they are not library code and are not distributed as such.
"scripts/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["palette"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/palette", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["win32job", "win32api", "win32con"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:palette.*"]
markers = [
    "e2e: requires a real QEMU binary, hardware acceleration and a guest image",
    "windows: Windows-only behaviour",
]
